name: Deploy backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Prepare deployment artifact
        run: |
          mkdir -p ../backend-release
          cp -a dist package.json package-lock.json ../backend-release/
          cp AWS/deploy-backend.sh ../backend-release/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: backend-release/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-release
          path: backend-release

      - name: Deploy and restart PM2
        run: bash backend-release/deploy-backend.sh
