version: 1
applications:
  - appRoot: frontend
    env:
      variables:
        VITE_API_BASE_URL: https://api.hindustan-hardware.in/api/v1
        VITE_SOCKET_URL: https://api.hindustan-hardware.in
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        # Cache npm's download cache. `npm ci` recreates node_modules each build.
        paths:
          - frontend/.npm/**/*
